<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2026 職場靈魂指引 · Tina</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --bg: #F9F6F1;
      --title: #5E544B;
      --body: #8C8279;
      --btn: #DBCFBD;
      --card: #FFFFFF;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      font-family: 'Noto Serif TC', serif;
      color: var(--body);
      min-height: 100vh;
    }
    .serif { font-family: 'Noto Serif TC', serif; }

    /* Noise texture overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    /* Breathing animation */
    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.12); opacity: 1; }
    }
    .breathe { animation: breathe 2s ease-in-out infinite; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp 0.7s ease forwards; }
    .fade-up-1 { animation: fadeUp 0.7s ease 0.1s forwards; opacity: 0; }
    .fade-up-2 { animation: fadeUp 0.7s ease 0.25s forwards; opacity: 0; }
    .fade-up-3 { animation: fadeUp 0.7s ease 0.4s forwards; opacity: 0; }
    .fade-up-4 { animation: fadeUp 0.7s ease 0.55s forwards; opacity: 0; }
    .fade-up-5 { animation: fadeUp 0.7s ease 0.7s forwards; opacity: 0; }
    .fade-up-6 { animation: fadeUp 0.7s ease 0.85s forwards; opacity: 0; }

    /* Decorative line */
    .deco-line {
      width: 40px;
      height: 1px;
      background: var(--btn);
      display: inline-block;
    }

    /* Card glass */
    .glass-card {
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(219,207,189,0.25);
      box-shadow: 0 2px 24px rgba(94,84,75,0.06), 0 1px 4px rgba(94,84,75,0.04);
      border-radius: 20px;
    }

    /* Input styling */
    .soul-input {
      background: rgba(249,246,241,0.8);
      border: 1px solid rgba(219,207,189,0.6);
      border-radius: 12px;
      padding: 14px 18px;
      width: 100%;
      font-family: 'Noto Serif TC', serif;
      font-size: 14px;
      color: var(--title);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .soul-input:focus {
      border-color: var(--btn);
      box-shadow: 0 0 0 3px rgba(219,207,189,0.2);
    }
    .soul-input::placeholder { color: #C5BAB0; }

    /* Button */
    .soul-btn {
      background: var(--btn);
      color: #fff;
      font-family: 'Noto Serif TC', serif;
      letter-spacing: 0.08em;
      border: none;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
    }
    .soul-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(219,207,189,0.5); }
    .soul-btn:active { transform: translateY(0); }
    .soul-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    /* Ornament */
    .ornament { color: var(--btn); font-size: 18px; letter-spacing: 4px; }

    /* Card number badge */
    .num-badge {
      width: 36px; height: 36px;
      border: 1px solid rgba(219,207,189,0.5);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px;
      color: var(--btn);
      flex-shrink: 0;
    }

    /* Scroll fade in */
    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
    .results-enter { animation: fadeIn 0.9s ease forwards; }

    /* Footer gradient */
    .footer-bg {
      background: linear-gradient(180deg, rgba(249,246,241,0) 0%, rgba(219,207,189,0.15) 100%);
    }
  </style>
</head>
<body>
  <div id="root"></div>

      },

      },

        wealth: "你的財富往往來自靈感爆發的瞬間，卻也容易在衝動消費中流失。建立一個「創意基金」帳戶，讓你的消費也充滿美感與意圖。",
      },
      4: {
        title: "建築者 · 磐石之魂",
        essence: "你是職場中最可信賴的存在。你用踏實的雙手，一磚一瓦地堆砌出別人只敢夢想的穩固結構。你的價值，往往在事情崩潰後才被真正看見。",
        wealth: "你天生的財務本能是保守穩健，這是你的禮物。2026 年，允許自己在穩固的基礎上，做一個「略微大膽」的投資嘗試——讓豐盛也有流動的空間。",
      },
      5: {
        title: "自由者 · 探索之魂",
        essence: "重複與固定是你最深的恐懼，變化與冒險才是你的氧氣。你在職場中最有活力的狀態，是當你有足夠的空間去嘗試、去失敗、去重新開始。",
        wealth: "財務穩定對你而言需要刻意練習。設立「自由基金」：固定存入一筆錢，用來支持你的探索，讓冒險不再以財務恐慌為代價。",
      },

        essence: "你把「照顧」當作一種藝術形式。在職場中，你是那個默默承擔、讓一切順暢運行的人。2026 年最重要的功課：讓自己也成為被照顧的人。",

      },

        wealth: "你對金錢的關係偏向神秘與距離感。2026 年，把財務學習當作一門「值得深究的學問」——一旦你真正理解了金錢的運作邏輯，你的豐盛將無可限量。",
      },
      8: {

        wealth: "你的財務潛力是所有數字中最強的，但「全有或全無」的心態會是你的阻力。2026 年，練習讓財富「穩定地積累」，而非只追求那個大爆發的瞬間。",
      },
      9: {

        essence: "你攜帶著整個宇宙的智慧而來。職場中，你有一種讓人說不清的感召力，能讓身邊的人看到更宏觀的視野。你的使命，從來不只是為了自己。",
        wealth: "你對金錢的態度超脫，有時甚至「太超脫」。2026 年，把財富視為實現理想的載體，而非世俗的枷鎖——讓豐盛成為你付出的能量來源。",
      },
      11: {
        title: "直覺者 · 光之傳遞者（卓越數）",
        essence: "你是宇宙的天線，接收著常人感知不到的頻率。職場中，你的直覺往往比任何數據都精準。學習信任那個「無法解釋但就是知道」的聲音。",
        wealth: "你的財富往往以非線性的方式到來——靈感、機遇、貴人。2026 年，保持財務的彈性空間，讓那些無法預測的豐盛禮物，有地方降落。",
      },
      22: {
        title: "建設者 · 宏願實踐者（卓越數）",
        essence: "你不只是在工作，你在建造一個時代。職場中，你有能力把最宏大的願景轉化為實際可行的系統。你的使命規模，值得你給自己更多的耐心。",
        wealth: "你的財務格局天生宏觀，但容易因「計畫太大」而遲遲不行動。2026 年，選定一個具體的財務目標，拆解成每週的小行動——巨人也是一步一步走過來的。",
      },
      33: {
        title: "療癒者 · 神聖奉獻者（卓越數）",
        essence: "你的存在本身就是一種療癒。你對職場、對人際的奉獻，源自一種深沉的愛。2026 年最重要的課題：讓這份愛也流向自己，你值得被你所療癒的那份溫柔對待。",
        wealth: "你把豐盛定義為「給予的能力」，而非擁有。2026 年，重新定義：豐盛的你，才能給予更多。允許自己先被填滿，財富才能真正流動。",
      },
    };

    const YEAR_NUMBER_DATA = {
      1: { keyword: "突破 · 重啟 · 先行", advice: "2026 是你的新週期元年。不要等待完美時機，你踏出的第一步，就是時機。職場上，主動提案、接受挑戰，命運偏愛先行者。" },
      2: { keyword: "合作 · 等待 · 細膩", advice: "這是一個深耕關係的年份。不急於衝刺，而是把時間投入在對的夥伴關係上。一個真誠的聯盟，勝過百次單打獨鬥。" },
      3: { keyword: "表達 · 創意 · 曝光", advice: "2026 年，讓自己被看見。分享你的想法、作品、觀點——職場能見度將為你帶來意想不到的轉機。你的聲音，有人在等待。" },
      4: { keyword: "建構 · 紀律 · 落地", advice: "這是夯實基礎的一年。制定系統、建立流程、培養習慣。看似緩慢的踏實，正在為你的下一個高峰默默備糧。" },
      5: { keyword: "變化 · 自由 · 轉型", advice: "2026 年，流動就是你的關鍵字。職場上的彈性與適應力，將為你開啟多條平行道路。擁抱那些「沒有計劃的計劃」。" },
      6: { keyword: "責任 · 療癒 · 歸屬", advice: "這一年，工作與生活的平衡將被重新校準。職場上，你的關懷與責任感將帶來深厚的信任；同時，學習把照顧也帶回給自己。" },
      7: { keyword: "內省 · 深化 · 蓄力", advice: "2026 年是沉潛的好時機。深入學習、提升專業深度、進行有意義的自我梳理。表面的熱鬧不是你的主場，深度才是你的武器。" },
      8: { keyword: "收穫 · 掌控 · 豐盛", advice: "這是你收割的年份。過去努力的成果將在 2026 年浮現。大膽談薪、爭取升遷、接受豐盛——你值得那個位置。" },
      9: { keyword: "完結 · 放下 · 蛻變", advice: "2026 年，某些職場篇章將走向完結。不必緊抓，學習優雅地告別——無論是角色、關係或心態——清空，才能迎接全新的豐盛週期。" },
    };

    // ─── HELPER FUNCTIONS ─────────────────────────────────────
    function reduceToSingleDigit(num) {
      if (num === 11 || num === 22 || num === 33) return num;
      if (num <= 9) return num;
      const reduced = String(num).split('').reduce((a, b) => a + parseInt(b), 0);
      return reduceToSingleDigit(reduced);
    }

    function calcLifeNumber(year, month, day) {
      const digits = `${year}${String(month).padStart(2,'0')}${String(day).padStart(2,'0')}`;
      const sum = digits.split('').reduce((a, b) => a + parseInt(b), 0);
      return reduceToSingleDigit(sum);
    }

    function calc2026Year(month, day) {
      const sum = 2 + 0 + 2 + 6 + month + day;
      return reduceToSingleDigit(sum);
    }

    const LOADING_TEXTS = [
      "正在連結財務密碼...",
      "翻閱靈魂地圖...",
      "校準你的宇宙頻率...",
      "解讀數字的低語...",
    ];

    // ─── COMPONENTS ───────────────────────────────────────────

    function OrnamentDivider() {
      return (
        <div className="flex items-center justify-center gap-3 my-6">
          <span className="deco-line"></span>
          <span className="ornament">✦</span>
          <span className="deco-line"></span>
        </div>
      );
    }

    function ResultCard({ delay, badge, title, subtitle, content, wealth, footer, lifeNum }) {
      return (
        <div className={`glass-card p-7 fade-up-${delay}`}>
          <div className="flex items-start gap-4 mb-5">
            <div className="num-badge serif">{badge}</div>
            <div>
              <p className="text-xs tracking-widest uppercase mb-1" style={{color:'var(--btn)'}}>
                {subtitle}
              </p>
              <h3 className="serif font-semibold text-base leading-snug" style={{color:'var(--title)'}}>
                {title}
              </h3>
            </div>
          </div>
          <div className="w-full h-px mb-5" style={{background:'rgba(219,207,189,0.3)'}}></div>
          <p className="serif text-sm leading-relaxed mb-4" style={{color:'var(--body)', fontSize:'13.5px', lineHeight:'2'}}>
            {content}
          </p>
          {wealth && (
            <>
              <div className="flex items-center gap-2 mb-3">
                <span style={{color:'var(--btn)', fontSize:'11px', letterSpacing:'0.15em'}}>✦ 豐盛頻率</span>
                <span className="deco-line" style={{width:'20px'}}></span>
              </div>
              <p className="serif text-sm leading-relaxed mb-4" style={{color:'var(--body)', fontSize:'13.5px', lineHeight:'2'}}>
                {wealth}
              </p>
            </>
          )}
          {footer && (
            <p className="serif text-xs text-center mt-5 pt-4" style={{color:'var(--btn)', borderTop:'1px solid rgba(219,207,189,0.3)', letterSpacing:'0.05em'}}>
              {footer}
            </p>
          )}
        </div>
      );
    }

    // ─── MAIN APP ─────────────────────────────────────────────
    function App() {
      const [step, setStep] = useState('form'); // form | loading | result
      const [form, setForm] = useState({ name: '', email: '', date: '' });
      const [errors, setErrors] = useState({});
      const [loadingText, setLoadingText] = useState('');
      const [result, setResult] = useState(null);

      const scriptURL = 'https://script.google.com/macros/s/AKfycbwcIxG26JplYUjgd7cTMCLzjQWJfQwCbxxj4DNkktJ_ZNN81qAR85lfpg3D6MNfvq4G/exec';

      function validate() {
        const e = {};
        if (!form.name.trim()) e.name = '請填寫稱呼';
        if (!form.email.trim() || !/\S+@\S+\.\S+/.test(form.email)) e.email = '請填寫有效的電子信箱';
        if (!form.date) e.date = '請選擇出生日期';
        setErrors(e);
        return Object.keys(e).length === 0;
      }

      async function handleSubmit(e) {
        e.preventDefault();
        if (!validate()) return;

        const rndText = LOADING_TEXTS[Math.floor(Math.random() * LOADING_TEXTS.length)];
        setLoadingText(rndText);
        setStep('loading');

        const [year, month, day] = form.date.split('-').map(Number);
        const lifeNum = calcLifeNumber(year, month, day);
        const yearNum = calc2026Year(month, day);

        // Send to Google Sheets
        try {
          const payload = new FormData();
          payload.append('name', form.name);
          payload.append('email', form.email);
          payload.append('birthdate', form.date);
          payload.append('lifeNumber', lifeNum);
          payload.append('yearNumber', yearNum);
          await fetch(scriptURL, { method: 'POST', body: payload });
        } catch (_) { /* silent fail */ }

        setTimeout(() => {
          setResult({ name: form.name, lifeNum, yearNum });
          setStep('result');
        }, 2200);
      }

      // ── FORM PAGE ──────────────────────────────────────────
      if (step === 'form') return (
        <div className="min-h-screen flex flex-col items-center justify-start px-5 pt-16 pb-16 relative z-10">

          {/* Header */}
          <div className="text-center mb-10 fade-up">
            <p className="text-xs tracking-widest mb-4" style={{color:'var(--btn)', letterSpacing:'0.25em'}}>
              TINA · 2026
            </p>
            <h1 className="serif font-light mb-2" style={{color:'var(--title)', fontSize:'clamp(22px,5vw,34px)', lineHeight:'1.5', letterSpacing:'0.06em'}}>
              職場財務指引
            </h1>
            <div className="flex items-center justify-center gap-3 my-4">
              <span className="deco-line"></span>
              <span className="ornament" style={{fontSize:'12px'}}>✦</span>
              <span className="deco-line"></span>
            </div>
            <p className="serif font-light text-sm leading-relaxed max-w-xs mx-auto" style={{color:'var(--body)', lineHeight:'2', fontSize:'13px'}}>
              在變動的時代<br/>尋找你內在最穩定的頻率<br/>以及財務密碼
            </p>
          </div>

          {/* Form Card */}
          <div className="glass-card w-full max-w-sm p-8 fade-up-2">
            <p className="serif text-center text-xs tracking-widest mb-7" style={{color:'var(--btn)', letterSpacing:'0.2em'}}>
              輸入你的靈魂資訊
            </p>

            <div className="flex flex-col gap-5">
              <div>
                <label className="serif text-xs mb-2 block" style={{color:'var(--title)', letterSpacing:'0.1em'}}>
                  稱呼
                </label>
                <input
                  className="soul-input"
                  type="text"
                  placeholder="請輸入你的名字或暱稱"
                  value={form.name}
                  onChange={e => setForm({...form, name: e.target.value})}
                />
                {errors.name && <p className="text-xs mt-1" style={{color:'#C4906E'}}>{errors.name}</p>}
              </div>

              <div>
                <label className="serif text-xs mb-2 block" style={{color:'var(--title)', letterSpacing:'0.1em'}}>
                  電子信箱
                </label>
                <input
                  className="soul-input"
                  type="email"
                  placeholder="your@email.com"
                  value={form.email}
                  onChange={e => setForm({...form, email: e.target.value})}
                />
                {errors.email && <p className="text-xs mt-1" style={{color:'#C4906E'}}>{errors.email}</p>}
              </div>

              <div>
                <label className="serif text-xs mb-2 block" style={{color:'var(--title)', letterSpacing:'0.1em'}}>
                  出生年月日
                </label>
                <input
                  className="soul-input"
                  type="date"
                  value={form.date}
                  onChange={e => setForm({...form, date: e.target.value})}
                  style={{colorScheme:'light'}}
                />
                {errors.date && <p className="text-xs mt-1" style={{color:'#C4906E'}}>{errors.date}</p>}
              </div>

              <button
                className="soul-btn w-full py-4 rounded-xl serif tracking-widest text-sm font-medium mt-2"
                onClick={handleSubmit}
              >
                解讀我的指引 ✦
              </button>
            </div>
          </div>

          {/* Bottom note */}
          <p className="serif text-center mt-8 text-xs fade-up-4" style={{color:'var(--btn)', letterSpacing:'0.05em', lineHeight:'2'}}>
            你的資訊將被溫柔守護<br/>僅用於個人化指引
          </p>
        </div>
      );

      // ── LOADING PAGE ────────────────────────────────────────
      if (step === 'loading') return (
        <div className="min-h-screen flex flex-col items-center justify-center px-5 relative z-10">
          <div className="breathe flex items-center justify-center" style={{
            width: 120, height: 120,
            borderRadius: '50%',
            border: '1px solid rgba(219,207,189,0.6)',
            background: 'radial-gradient(circle, rgba(219,207,189,0.15) 0%, transparent 70%)',
          }}>
            <div style={{
              width: 80, height: 80,
              borderRadius: '50%',
              border: '1px solid rgba(219,207,189,0.4)',
              background: 'radial-gradient(circle, rgba(219,207,189,0.2) 0%, transparent 70%)',
              display:'flex', alignItems:'center', justifyContent:'center'
            }}>
              <span className="ornament" style={{fontSize:'20px'}}>✦</span>
            </div>
          </div>
          <p className="serif text-sm mt-8 tracking-wider" style={{color:'var(--body)', letterSpacing:'0.12em'}}>
            {loadingText}
          </p>
        </div>
      );

      // ── RESULT PAGE ─────────────────────────────────────────
      const lifeData = LIFE_NUMBER_DATA[result.lifeNum] || LIFE_NUMBER_DATA[9];
      const yearData = YEAR_NUMBER_DATA[result.yearNum] || YEAR_NUMBER_DATA[9];

      return (
        <div className="min-h-screen flex flex-col items-center px-5 pt-14 pb-20 relative z-10 results-enter">

          {/* Result header */}
          <div className="text-center mb-10">
            <p className="text-xs tracking-widest mb-3" style={{color:'var(--btn)', letterSpacing:'0.25em'}}>
              TINA · 2026 · 專屬指引
            </p>
            <h2 className="serif font-light mb-2" style={{color:'var(--title)', fontSize:'clamp(20px,5vw,28px)', letterSpacing:'0.08em'}}>
              {result.name} 的專屬指引
            </h2>
            <OrnamentDivider />
            <div className="flex justify-center gap-6">
              <div className="text-center">
                <p className="text-xs mb-1" style={{color:'var(--btn)', letterSpacing:'0.1em'}}>生命靈數</p>
                <p className="serif font-semibold text-2xl" style={{color:'var(--title)'}}>{result.lifeNum}</p>
              </div>
              <div style={{width:'1px', background:'rgba(219,207,189,0.4)'}}></div>
              <div className="text-center">
                <p className="text-xs mb-1" style={{color:'var(--btn)', letterSpacing:'0.1em'}}>2026 流年</p>
                <p className="serif font-semibold text-2xl" style={{color:'var(--title)'}}>{result.yearNum}</p>
              </div>
            </div>
          </div>

          {/* Cards */}
          <div className="w-full max-w-sm flex flex-col gap-5">

            {/* Card 1 */}
            <ResultCard
              delay={2}
              badge="壹"
              subtitle="靈魂本質"
              title={lifeData.title}
              content={lifeData.essence}
            />

            {/* Card 2 */}
            <ResultCard
              delay={3}
              badge="貳"
              subtitle="2026 流年能量"
              title={`關鍵字：${yearData.keyword}`}
              content={yearData.advice}
            />

            {/* Card 3 */}
            <ResultCard
              delay={4}
              badge="叁"
              subtitle="豐盛頻率｜財務指引"
              title="你的財務靈魂密碼"
              content={lifeData.essence}
              wealth={lifeData.wealth}
              footer="數字是路標，行動是地圖。"
            />
          </div>

          {/* Footer CTA */}
          <div className="fade-up-5 w-full max-w-sm mt-10">
            <div className="glass-card p-7 text-center footer-bg">
              <p className="text-xs tracking-widest mb-3" style={{color:'var(--btn)', letterSpacing:'0.2em'}}>
                ✦ 追蹤 Tina 預約深度解析 ✦
              </p>
              <p className="serif text-sm leading-relaxed mb-5" style={{color:'var(--body)', lineHeight:'2', fontSize:'13px'}}>
                這份指引只是起點<br/>你的靈魂藍圖，值得更深的探索
              </p>
              <a
                href="https://www.instagram.com/tina__o.o?igsh=MWdmN2N6M2NnZGwwag%3D%3D&utm_source=qr"
                target="_blank"
                rel="noopener noreferrer"
                className="soul-btn inline-block px-8 py-3 rounded-full serif text-sm tracking-wider"
                style={{textDecoration:'none', display:'inline-block'}}
              >
                點擊這裡，讓 Tina 陪你一起溫柔生存
              </a>
            </div>
          </div>

          {/* Restart */}
          <button
            onClick={() => { setStep('form'); setForm({name:'',email:'',date:''}); setResult(null); }}
            className="mt-8 serif text-xs fade-up-6"
            style={{color:'var(--btn)', background:'none', border:'none', cursor:'pointer', letterSpacing:'0.1em', textDecoration:'underline', textUnderlineOffset:'3px'}}
          >
            重新解讀
          </button>

          {/* Footer */}
          <p className="serif text-center mt-8 text-xs fade-up-6" style={{color:'#C5BAB0', letterSpacing:'0.05em', lineHeight:'2.2'}}>
            願這份指引，成為你職場路上的微光<br/>
            本指引由 Tina 發送 🐾
          </p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
