<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2026 職場靈魂指引 · Tina</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root { --bg:#F9F6F1; --title:#5E544B; --body:#8C8279; --btn:#DBCFBD; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background-color:var(--bg); font-family:'Noto Serif TC',serif; color:var(--body); min-height:100vh; }
    .serif { font-family:'Noto Serif TC',serif; }
    body::before { content:''; position:fixed; inset:0; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E"); pointer-events:none; z-index:0; }
    @keyframes breathe { 0%,100%{transform:scale(1);opacity:.7} 50%{transform:scale(1.12);opacity:1} }
    .breathe { animation:breathe 2s ease-in-out infinite; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }
    .fu { animation:fadeUp .7s ease forwards; }
    .fu1{animation:fadeUp .7s ease .1s forwards;opacity:0}
    .fu2{animation:fadeUp .7s ease .25s forwards;opacity:0}
    .fu3{animation:fadeUp .7s ease .4s forwards;opacity:0}
    .fu4{animation:fadeUp .7s ease .55s forwards;opacity:0}
    .fu5{animation:fadeUp .7s ease .7s forwards;opacity:0}
    .fu6{animation:fadeUp .7s ease .85s forwards;opacity:0}
    .deco-line{width:40px;height:1px;background:var(--btn);display:inline-block}
    .glass-card{background:rgba(255,255,255,0.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(219,207,189,0.25);box-shadow:0 2px 24px rgba(94,84,75,.06),0 1px 4px rgba(94,84,75,.04);border-radius:20px}
    .soul-input{background:rgba(249,246,241,0.8);border:1px solid rgba(219,207,189,0.6);border-radius:12px;padding:14px 18px;width:100%;font-family:'Noto Serif TC',serif;font-size:14px;color:var(--title);outline:none;transition:border-color .2s,box-shadow .2s}
    .soul-input:focus{border-color:var(--btn);box-shadow:0 0 0 3px rgba(219,207,189,.2)}
    .soul-input::placeholder{color:#C5BAB0}
    .soul-btn{background:var(--btn);color:#fff;font-family:'Noto Serif TC',serif;letter-spacing:.08em;border:none;cursor:pointer;transition:transform .15s,box-shadow .15s,opacity .15s}
    .soul-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(219,207,189,.5)}
    .soul-btn:active{transform:translateY(0)}
    .soul-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
    .num-badge{width:36px;height:36px;border:1px solid rgba(219,207,189,.5);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--btn);flex-shrink:0}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    .results-enter{animation:fadeIn .9s ease forwards}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzytHgRZbg_C0yoUWZp11tbgKISmE4KEsmXIf-e2bliq_iQnj8SjnmtXonEnZvKUieO/exec';

const SOUL = {
  1:  { title:"開創者 · 先行之魂",        essence:"你是職場中天生的領路人，內心燃著一把誰也熄不滅的火。你不甘跟隨，渴望定義自己的航道。這份強烈的自主意志，讓你在混沌中仍能找到方向。在協作中，學習偶爾放手，讓他人也有發光的空間。",           wealth:"你是天生的財務冒險家——看準機會就全力衝刺，行動力驚人。但「一把梭哈」的模式容易讓財務大起大落。建議設立「靈魂備用金」，每月固定保留收入 10–15%，讓你在大膽開創的同時擁有溫柔的退路。2026 年財務關鍵字：主動出擊，但留一道安全網。" },
  2:  { title:"連結者 · 和諧之魂",        essence:"你的職場超能力是感知人心。你能在最微妙的關係裂縫中架起橋樑，讓團隊回到和諧的頻率。你的柔軟，從來不是弱點，而是最細膩的領導力。",                                                                   wealth:"你對金錢的態度溫柔，卻也容易在人際關係中不知不覺散財。2026 年的財務功課：練習說「這個我需要想一想」，給自己 48 小時的緩衝再做決定。守住自己的豐盛，才能持續給予。" },
  3:  { title:"表達者 · 光亮之魂",        essence:"你的存在本身就是靈感。語言、創意、表達——這是你與生命的對話方式。職場中，你最閃耀的時刻是當你忘記「應該如何表現」，只是純粹地成為自己。",                                                             wealth:"你的財富往往誕生於靈感爆發的瞬間，卻也容易在衝動消費中快速流失。2026 年，建立一個「創意基金」獨立帳戶，把想花的衝動先存進去等三天——若仍想要，才是真正值得的。讓你的財務也充滿美感與意圖。" },
  4:  { title:"建築者 · 磐石之魂",        essence:"你是職場中最可信賴的存在。你用踏實的雙手，一磚一瓦地堆砌出別人只敢夢想的穩固結構。你的價值，往往在事情崩潰後才被真正看見。",                                                                           wealth:"你的財務性格保守穩健，這是絕對的優勢——你不會衝動投資，也不容易被話術說服。但過度謹慎會讓你錯失複利增長的時機。2026 年，允許自己在穩固的基礎上做一個「略微大膽」的嘗試：定期定額進場，讓豐盛也擁有流動的空間。" },
  5:  { title:"自由者 · 探索之魂",        essence:"重複與固定是你最深的恐懼，變化與冒險才是你的氧氣。你在職場中最有活力的狀態，是當你有足夠的空間去嘗試、去失敗、去重新開始。",                                                                             wealth:"財務穩定對你而言是需要刻意建立的系統，因為你的天性熱愛流動、厭惡束縛。2026 年，設立「自由基金」：每月固定轉入一筆專屬於探索的預算，讓冒險不再以財務恐慌為代價。有了安全網，你的自由才能飛得更高更遠。" },
  6:  { title:"守護者 · 愛與責任之魂",    essence:"你把「照顧」當作一種藝術形式。在職場中，你是那個默默承擔、讓一切順暢運行的人。2026 年最重要的功課：讓自己也成為被照顧的對象。",                                                                         wealth:"你的財務習慣是先顧好所有人，最後才輪到自己。2026 年，練習「先付錢給自己」：薪水入帳的第一件事，把 10% 轉入只屬於你的帳戶。每季給自己一個純粹的財務禮物，豐盛從自我滋養開始流動。" },
  7:  { title:"智慧者 · 深潛之魂",        essence:"你活在問題的縱深處，而非表面。職場中，你的分析力與洞察力讓你成為不可取代的智庫。你的挑戰是學習讓答案在適當的時機，溫柔地流出。",                                                                         wealth:"你對金錢保持一種神秘的距離感，既不狂熱追逐，也不刻意排斥。但「分析過度、遲遲不行動」是你最大的財務阻力。2026 年，把財務學習當作值得深究的學問，選定一個方向深入研究後付諸行動——真正理解金錢邏輯的你，豐盛將無可限量。" },
  8:  { title:"掌權者 · 豐盛之魂",        essence:"你是天生的豐盛體質。權力、資源、影響力——這些在你手中不是貪婪，而是流動的工具。職場中，你最需要的不是能力，而是相信自己值得這一切。",                                                                   wealth:"你的財務潛力是所有數字中最強大的，對金錢有天生的敏感度與掌控欲。但「全有或全無」的心態是你的隱形阻力。2026 年，大膽談薪、主動爭取報酬，同時建立分散的資產組合，讓豐盛持續滾動而非只等待那個大爆發。" },
  9:  { title:"智者 · 圓滿之魂",          essence:"你攜帶著整個宇宙的智慧而來。職場中，你有一種讓人說不清的感召力，能讓身邊的人看到更宏觀的視野。你的使命，從來不只是為了自己。",                                                                           wealth:"你對金錢的態度超脫，有時甚至「太超脫」，覺得談錢俗氣。2026 年，練習重新定義豐盛：財富是你實現理想的載體，不是世俗枷鎖。有足夠的資源，你才能更自由地給予、更廣泛地影響——讓豐盛成為你使命的燃料。" },
  11: { title:"直覺者 · 光之傳遞者（卓越數）", essence:"你是宇宙的天線，接收著常人感知不到的頻率。職場中，你的直覺往往比任何數據都精準。學習信任那個「無法解釋但就是知道」的聲音。",                                                                   wealth:"你的財富往往以非線性、無法預測的方式到來——一個靈感、一次機遇、一位貴人。2026 年，建立「彈性財務結構」：保留固定儲蓄作為基底，同時為那些突如其來的豐盛禮物留下空間。直覺帶來的機會，你需要有資本去接住。" },
  22: { title:"建設者 · 宏願實踐者（卓越數）", essence:"你不只是在工作，你在建造一個時代。職場中，你有能力把最宏大的願景轉化為實際可行的系統。你的使命規模，值得你給自己更多的耐心。",                                                                   wealth:"你的財務格局天生宏觀，眼光放得極遠，卻容易因為「計畫還不夠完整」而遲遲不行動。2026 年，選定一個具體可執行的財務目標，拆解成每週的小行動立即啟動——巨人也是一步一步走出來的，豐盛需要你現在就開始建造地基。" },
  33: { title:"療癒者 · 神聖奉獻者（卓越數）", essence:"你的存在本身就是一種療癒。你對職場、對人際的奉獻，源自一種深沉的愛。2026 年最重要的課題：讓這份愛也流向自己，你值得被你所療癒的那份溫柔對待。",                                               wealth:"你把豐盛定義為「給予的能力」，容易忽略自己的財務需求。2026 年，重新定義你的財務哲學：豐盛的你，才能給予更多。設立個人財務底線，讓給予從富足而非消耗出發——財富才能真正循環流動。" },
};

const YEAR = {
  1:{kw:"突破 · 重啟 · 先行",   adv:"2026 是你的新週期元年。不要等待完美時機，你踏出的第一步，就是時機。職場上，主動提案、接受挑戰，命運偏愛先行者。"},
  2:{kw:"合作 · 等待 · 細膩",   adv:"這是一個深耕關係的年份。不急於衝刺，而是把時間投入在對的夥伴關係上。一個真誠的聯盟，勝過百次單打獨鬥。"},
  3:{kw:"表達 · 創意 · 曝光",   adv:"2026 年，讓自己被看見。分享你的想法、作品、觀點——職場能見度將為你帶來意想不到的轉機。你的聲音，有人在等待。"},
  4:{kw:"建構 · 紀律 · 落地",   adv:"這是夯實基礎的一年。制定系統、建立流程、培養習慣。看似緩慢的踏實，正在為你的下一個高峰默默備糧。"},
  5:{kw:"變化 · 自由 · 轉型",   adv:"2026 年，流動就是你的關鍵字。職場上的彈性與適應力，將為你開啟多條平行道路。擁抱那些「沒有計劃的計劃」。"},
  6:{kw:"責任 · 療癒 · 歸屬",   adv:"這一年，工作與生活的平衡將被重新校準。職場上，你的關懷與責任感將帶來深厚的信任；同時，學習把照顧也帶回給自己。"},
  7:{kw:"內省 · 深化 · 蓄力",   adv:"2026 年是沉潛的好時機。深入學習、提升專業深度、進行有意義的自我梳理。深度才是你的武器。"},
  8:{kw:"收穫 · 掌控 · 豐盛",   adv:"這是你收割的年份。過去努力的成果將在 2026 年浮現。大膽談薪、爭取升遷、接受豐盛——你值得那個位置。"},
  9:{kw:"完結 · 放下 · 蛻變",   adv:"2026 年，某些職場篇章將走向完結。不必緊抓，學習優雅地告別——無論是角色、關係或心態——清空，才能迎接全新的豐盛週期。"},
};

function reduceNum(n) {
  if(n===11||n===22||n===33) return n;
  if(n<=9) return n;
  return reduceNum(String(n).split('').reduce((a,b)=>a+parseInt(b),0));
}
function calcLife(y,m,d) {
  const s = `${y}${String(m).padStart(2,'0')}${String(d).padStart(2,'0')}`;
  return reduceNum(s.split('').reduce((a,b)=>a+parseInt(b),0));
}
function calcYear(m,d) { return reduceNum(2+0+2+6+m+d); }

const LOADS = ["正在連結財務密碼...","翻閱靈魂地圖...","校準你的宇宙頻率...","解讀數字的低語..."];

function Divider() {
  return (
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:12,margin:'20px 0'}}>
      <span className="deco-line"></span>
      <span style={{color:'var(--btn)',fontSize:12}}>✦</span>
      <span className="deco-line"></span>
    </div>
  );
}

function Card({delay, badge, sub, title, body, footer}) {
  return (
    <div className={`glass-card fu${delay}`} style={{padding:'28px'}}>
      <div style={{display:'flex',alignItems:'flex-start',gap:14,marginBottom:20}}>
        <div className="num-badge serif">{badge}</div>
        <div>
          <p style={{fontSize:11,letterSpacing:'0.18em',color:'var(--btn)',marginBottom:4}}>{sub}</p>
          <h3 className="serif" style={{fontWeight:600,fontSize:15,color:'var(--title)',lineHeight:1.5}}>{title}</h3>
        </div>
      </div>
      <div style={{width:'100%',height:1,background:'rgba(219,207,189,0.3)',marginBottom:18}}></div>
      <p className="serif" style={{fontSize:13.5,lineHeight:2.1,color:'var(--body)'}}>{body}</p>
      {footer && (
        <p className="serif" style={{fontSize:11.5,textAlign:'center',marginTop:20,paddingTop:16,borderTop:'1px solid rgba(219,207,189,0.3)',color:'var(--btn)',letterSpacing:'0.06em'}}>{footer}</p>
      )}
    </div>
  );
}

function App() {
  const [step, setStep] = useState('form');
  const [form, setForm] = useState({name:'',email:'',date:''});
  const [errs, setErrs] = useState({});
  const [loadTxt, setLoadTxt] = useState('');
  const [res, setRes] = useState(null);

  function validate() {
    const e={};
    if(!form.name.trim()) e.name='請填寫稱呼';
    if(!/\S+@\S+\.\S+/.test(form.email)) e.email='請填寫有效的電子信箱';
    if(!form.date) e.date='請選擇出生日期';
    setErrs(e);
    return !Object.keys(e).length;
  }

  async function handleSubmit(ev) {
    ev.preventDefault();
    if(!validate()) return;
    setLoadTxt(LOADS[Math.floor(Math.random()*LOADS.length)]);
    setStep('loading');

    const [y,m,d] = form.date.split('-').map(Number);
    const ln = calcLife(y,m,d);
    const yn = calcYear(m,d);

    // Google Sheets — no-cors avoids CORS error
    try {
      const fd = new FormData();
      fd.append('name', form.name);
      fd.append('email', form.email);
      fd.append('birthdate', form.date);
      fd.append('lifeNumber', ln);
      fd.append('yearNumber', yn);
      await fetch(SCRIPT_URL, { method:'POST', mode:'no-cors', body:fd });
    } catch(_) {}

    setTimeout(() => { setRes({name:form.name, ln, yn}); setStep('result'); }, 2300);
  }

  /* ── FORM ── */
  if(step==='form') return (
    <div style={{minHeight:'100vh',display:'flex',flexDirection:'column',alignItems:'center',padding:'64px 20px 80px',position:'relative',zIndex:1}}>
      <div className="fu" style={{textAlign:'center',marginBottom:40}}>
        <p style={{fontSize:11,letterSpacing:'0.28em',color:'var(--btn)',marginBottom:16}}>TINA · 2026</p>
        <h1 className="serif" style={{color:'var(--title)',fontSize:'clamp(22px,6vw,34px)',fontWeight:300,letterSpacing:'0.07em',lineHeight:1.5}}>職場財務指引</h1>
        <Divider />
        <p className="serif" style={{fontSize:13,lineHeight:2.2,color:'var(--body)',maxWidth:280,margin:'0 auto'}}>
          在變動的時代<br/>尋找你內在最穩定的頻率<br/>以及財務密碼
        </p>
      </div>

      <div className="glass-card fu2" style={{width:'100%',maxWidth:360,padding:'36px 28px'}}>
        <p className="serif" style={{textAlign:'center',fontSize:11,letterSpacing:'0.22em',color:'var(--btn)',marginBottom:28}}>輸入你的靈魂資訊</p>
        <div style={{display:'flex',flexDirection:'column',gap:20}}>
          {[
            {key:'name', label:'稱呼', type:'text', ph:'請輸入你的名字或暱稱'},
            {key:'email', label:'電子信箱', type:'email', ph:'your@email.com'},
          ].map(f=>(
            <div key={f.key}>
              <label className="serif" style={{fontSize:12,letterSpacing:'0.1em',color:'var(--title)',display:'block',marginBottom:8}}>{f.label}</label>
              <input className="soul-input" type={f.type} placeholder={f.ph}
                value={form[f.key]} onChange={e=>setForm({...form,[f.key]:e.target.value})} />
              {errs[f.key] && <p style={{fontSize:11,color:'#C4906E',marginTop:4}}>{errs[f.key]}</p>}
            </div>
          ))}
          <div>
            <label className="serif" style={{fontSize:12,letterSpacing:'0.1em',color:'var(--title)',display:'block',marginBottom:8}}>出生年月日</label>
            <input className="soul-input" type="date" value={form.date} style={{colorScheme:'light'}}
              onChange={e=>setForm({...form,date:e.target.value})} />
            {errs.date && <p style={{fontSize:11,color:'#C4906E',marginTop:4}}>{errs.date}</p>}
          </div>
          <button className="soul-btn serif" style={{width:'100%',padding:'15px',borderRadius:12,fontSize:14,letterSpacing:'0.1em',marginTop:4}}
            onClick={handleSubmit}>解讀我的指引 ✦</button>
        </div>
      </div>
      <p className="serif fu4" style={{textAlign:'center',marginTop:32,fontSize:11,color:'var(--btn)',lineHeight:2.2,letterSpacing:'0.05em'}}>
        你的資訊將被溫柔守護<br/>僅用於個人化指引
      </p>
    </div>
  );

  /* ── LOADING ── */
  if(step==='loading') return (
    <div style={{minHeight:'100vh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',position:'relative',zIndex:1}}>
      <div className="breathe" style={{width:120,height:120,borderRadius:'50%',border:'1px solid rgba(219,207,189,0.6)',background:'radial-gradient(circle,rgba(219,207,189,.15) 0%,transparent 70%)',display:'flex',alignItems:'center',justifyContent:'center'}}>
        <div style={{width:76,height:76,borderRadius:'50%',border:'1px solid rgba(219,207,189,0.4)',display:'flex',alignItems:'center',justifyContent:'center'}}>
